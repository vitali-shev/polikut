firebase:
  base-url: https://firebasestorage.googleapis.com
  bucket-name: polikut-storage.firebasestorage.app

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    chat-id: ${TELEGRAM_CHAT_ID}

nova-poshta:
  base-url: https://api.novaposhta.ua/v2.0/json/
  api-key: ${NOVA_POSHTA_API_KEY}

spring:
  application:
    name: polikut

  security:
    user:
      name: admin
      password: "{noop}${ADMIN_PASSWORD}"
      roles: ADMIN

  cloud:
    gcp:
      credentials:
        location: ${FIREBASE_CREDENTIALS_PATH}

  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}